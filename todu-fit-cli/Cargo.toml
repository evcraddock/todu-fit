[package]
name = "todu-fit-cli"
version = "2.9.2"
edition = "2021"
rust-version = "1.90"

[dependencies]
todu-fit-protocol = { path = "../todu-fit-protocol" }
todu-fit-service = { path = "../todu-fit-service" }
todu-fit-core = { path = "../todu-fit-core" }
automerge = "0.12"
axum = "0.8"  # Used for local callback server in auth
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
urlencoding = "2"

sha2 = "0.10"
fs2 = "0.4"
[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[[bin]]
name = "fit"
path = "src/main.rs"
