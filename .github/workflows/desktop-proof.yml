name: Desktop native proof

on:
  pull_request:
    paths: ['apps/desktop/**', 'adapters/desktop/**', 'todu-fit-core/**', 'Cargo.*', '.github/workflows/desktop-proof.yml']
  workflow_dispatch:

jobs:
  packaged-persistence:
    name: Desktop packaged persistence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows is a target, but not a gate for this first milestone.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy -p todu-fit-desktop -- -D warnings
      - run: npm run package
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm test
        working-directory: apps/desktop
      - run: npm run test:packaged
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-proof-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/out/
