name: Desktop build checks

on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'adapters/desktop/**', 'todu-fit-core/**', 'todu-fit-cli/**', 'todu-fit-protocol/**', 'todu-fit-service/**', 'Cargo.*', '.github/workflows/desktop-proof.yml']
  pull_request:
    paths: ['apps/desktop/**', 'adapters/desktop/**', 'todu-fit-core/**', 'todu-fit-cli/**', 'todu-fit-protocol/**', 'todu-fit-service/**', 'Cargo.*', '.github/workflows/desktop-proof.yml']
  workflow_dispatch:

jobs:
  packaged-persistence:
    name: Desktop build and API tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy -p todu-fit-cli -- -D warnings
      - name: Build Linux and Windows installers
        if: runner.os != 'macOS'
        run: npm run package:installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build signed macOS installer
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$CSC_KEY_PASSWORD" ]]; then
            echo 'MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD are required for signed macOS builds.' >&2
            exit 1
          fi
          npm run package:installer
      - name: Build unsigned macOS PR preview (no signing secrets)
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const config = structuredClone(require('./package.json').build);
          config.mac.identity = null;
          config.mac.forceCodeSigning = false;
          delete config.afterSign;
          fs.writeFileSync('preview-builder.json', JSON.stringify(config));
          NODE
          npx electron-builder --config preview-builder.json
      - run: npm test
        working-directory: apps/desktop
      - name: Exercise the Linux AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 5
        working-directory: apps/desktop
        run: |
          archive=( "$PWD"/out/*.AppImage )
          (cd "$RUNNER_TEMP" && "${archive[0]}" --appimage-extract >/dev/null)
          export TODU_PACKAGED_EXECUTABLE="$RUNNER_TEMP/squashfs-root/todu-fit-desktop"
          xvfb-run --auto-servernum npm run test:packaged
      - name: Install and exercise the macOS DMG
        if: runner.os == 'macOS'
        timeout-minutes: 5
        working-directory: apps/desktop
        run: |
          image=( out/*.dmg )
          mount=$(mktemp -d)
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$RUNNER_TEMP/Todu Fit Proof.app"
          ditto "$mount/Todu Fit Proof.app" "$app"
          export TODU_PACKAGED_EXECUTABLE="$app/Contents/MacOS/Todu Fit Proof"
          npm run test:packaged
      - name: Install and exercise the Windows setup executable
        if: runner.os == 'Windows'
        timeout-minutes: 5
        working-directory: apps/desktop
        run: |
          $installer = Get-Item out/*.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'FitDesktop'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Fit setup exited with $($install.ExitCode)" }
          $env:TODU_PACKAGED_EXECUTABLE = Join-Path $installDir 'Todu Fit Proof.exe'
          npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.os }}-${{ github.event_name == 'pull_request' && 'preview' || 'main' }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
